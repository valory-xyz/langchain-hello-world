[project]
name = "langchain-hello-world"
version = "0.1.0"
description = "LangGraph agent demo with a Safe-based transaction executor."
authors = [{ name = "Naiane Rosa", email = "naiane.rosa@valory.xyz" }]
requires-python = ">=3.10,<4.0"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "langchain-community>=0.3.16,<0.4",
    "langgraph>=0.2.66,<0.3",
    "langchain-anthropic>=0.3.3,<0.4",
    "tavily-python>=0.5.0,<0.6",
    "langgraph-checkpoint-sqlite>=2.0.3,<3",
    "langchain-openai>=0.3.1,<0.4",
    "python-dotenv>=1.0.1,<2",
    "safe-eth-py>=7.0.0,<8",
    "web3>=7.8.0,<8",
    "hexbytes>=1.3.0,<2",
]

[dependency-groups]
release = [
    "pyinstaller>=6.8.0,<7",
]

[tool.uv]
package = false
default-groups = []
