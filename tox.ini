; Minimal tox config kept only for `tomte check-security`, which the
; common_checks workflow invokes; it expands to `tox -p -e bandit -e
; safety`. The previous full tox.ini was a copy-pasted
; hello_world_abci template whose envs targeted packages/ / scripts/ /
; tests/ paths that don't exist in this repo and were never run.

[tox]
envlist = bandit, safety
skipsdist = True

[testenv:bandit]
skip_install = True
deps =
    tomte[bandit]==0.6.2
commands =
    bandit -r langchain_hello_world -s B101

[testenv:safety]
skip_install = True
deps =
    tomte[safety]==0.6.2
    ; safety 3.x via newer tomte requires --policy-file. Keep the policy
    ; alongside this config so the ignore list (if any) stays editable.
commands =
    safety check --policy-file .safety-policy.yml
